[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "antibacterial-marine-polyketides"
version = "0.1.0"
description = "Reproducibility notebooks and data for marine antibacterial polyketides"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==1.24.4",
  "pandas==1.5.3",
  "scipy==1.10.1",
  "matplotlib==3.7.5",
  "seaborn==0.12.2",
  "scikit-learn==1.2.2",
  "rdkit==2023.9.6",
  "deepchem==2.8.0",
  "bioinfokit==2.1.4",
  "nbformat>=5.10,<6",
  "nbclient>=0.10,<0.11",
  "ipykernel>=6.29,<7",
  "ipython==8.18.1",
  "matplotlib-inline==0.1.7",
]

[project.optional-dependencies]
tmap = ["faerun>=0.4", "mhfp>=1.9", "annoy==1.17.3"]
native-build = ["cmake==3.31.10"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["amp"]

# Native Reymond-group TMAP is installed separately through its conda channel.
# The similarly named PyPI package is not a substitute.
# This is a reconstructed execution environment, not the original 2023 environment.
